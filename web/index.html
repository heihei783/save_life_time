<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>winSignIn</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f5fa}body{max-width:820px;margin:auto;padding:14px}h1{font-size:1.6rem}section{background:white;padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 2px 10px #14244712}input,button{padding:10px;margin:4px;border:1px solid #cbd3e1;border-radius:8px;font:inherit}button{position:relative;cursor:pointer;background:#1a63d8;color:white;border:0;transition:filter .18s,transform .08s,background .18s}button:hover:not(:disabled){filter:brightness(1.07)}button:active:not(:disabled){transform:translateY(1px)}button:focus-visible{outline:3px solid #1a63d855;outline-offset:2px}button:disabled{cursor:not-allowed}button.busy{color:transparent!important;pointer-events:none;cursor:progress}button.busy::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #ffffff55;border-top-color:#fff;animation:spin .7s linear infinite}button.secondary.busy::after{border-color:rgba(35,52,6,.3);border-top-color:#234}button.secondary{background:#e9effa;color:#234}button:disabled{opacity:.5}.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.row input{min-width:0;flex:1}.muted{color:#64708a;font-size:.9rem}.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.82rem;font-weight:600}.badge.ok{color:#087c43;background:#e6f5ed}.badge.bad{color:#bd2525;background:#fdeaea}.badge.unknown{color:#64708a;background:#eef1f6}.rollcall{border-top:1px solid #edf0f5;padding:10px 0}.ok{color:#087c43}.bad{color:#bd2525}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}video{width:100%;max-height:320px;background:#111;border-radius:8px}#progress{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}#progress.on{opacity:1}#progress.on::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#1a63d8,#4f9cf7,transparent);animation:barSlide 1s ease-in-out infinite}@keyframes barSlide{to{left:100%}}@keyframes spin{to{transform:rotate(360deg)}}#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;width:min(92vw,520px);pointer-events:none}.toast{background:#172033;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 6px 24px #0003;font-size:.92rem;line-height:1.4;max-width:100%;opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s}.toast.show{opacity:1;transform:none}.toast.ok{background:#0f7a45}.toast.bad{background:#b32424}@media (prefers-reduced-motion:reduce){button.busy::after,#progress.on::before{animation:none}.toast{transition:none}}
    .camera-preview{position:relative;overflow:hidden;max-height:320px;background:#111;border-radius:8px}.camera-preview video{display:block;width:100%;max-height:320px;object-fit:contain;background:transparent;border-radius:0;transform-origin:center;transition:transform .1s linear}.scan-guide{position:absolute;top:50%;left:50%;width:280px;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 999px #0006;pointer-events:none}.zoom-row{display:flex;align-items:center;gap:8px}.zoom-row.hidden{display:none}.zoom-row input[type=range]{min-width:120px;flex:1}.zoom-value{min-width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
  </style>

<body>
<div id="progress"></div><div id="toasts"></div>
<h1>winSignIn · 网页签到</h1>
<section id="auth"><h2>私有站点登录</h2><div class="row"><input id="admin" type="password" placeholder="管理员口令"><button id="adminBtn">进入</button></div></section>
<main id="app" class="hidden">
  <section><h2>学校账号</h2><div class="row"><input id="user" placeholder="学号/用户名"><input id="pass" type="password" placeholder="密码"><label><input id="remember" type="checkbox" checked>记住 CAS 会话</label><button id="schoolBtn">账号密码快速登录</button><button class="secondary" id="casWebBtn">学校网页认证（验证码/短信）</button></div><div id="casPanel" class="hidden"><p class="muted">在学校认证页面内完成密码、验证码或短信验证。认证域与管理站点分离；完成后此处会自动保存会话。</p><iframe id="casFrame" title="学校统一认证" style="width:100%;height:70vh;border:1px solid #ccd3e1;border-radius:10px"></iframe></div><div class="row"><button class="secondary" id="refreshBtn">刷新登录会话</button><button class="secondary" id="accountsBtn">检测账号状态</button></div><div id="accounts"></div><p class="muted">账号会话保存在服务器数据卷。显示「已过期」的账号请用帐号密码重新登录一次：会更新原账号的会话，不会重复添加。自动登录不成功时，可在独立认证页面继续完成验证码或短信验证。</p></section>
  <section><h2>签到设置</h2><div class="row"><label>最短错峰秒数 <input id="minDelay" type="number" min="0" max="60" value="0"></label><label>最长错峰秒数 <input id="maxDelay" type="number" min="0" max="60" value="1"></label><label><input id="autoNumber" type="checkbox">自动提取数字签到码</label></div><div class="row"><label>雷达策略 <select id="radarScheme"><option value="trilateration">三点定位</option><option value="empty">空答案提交</option></select></label></div><textarea id="probePoints" rows="3" placeholder="每行一个探测点：纬度,经度；至少三行"></textarea><div><button class="secondary" id="saveSettings">保存设置</button></div></section>
  <section><h2>二维码签到</h2><div class="camera-preview"><video id="video" playsinline webkit-playsinline muted></video><div id="scanGuide" class="scan-guide hidden" aria-hidden="true"></div></div><div id="zoomControls" class="zoom-row hidden"><label for="zoomSlider">缩放</label><input id="zoomSlider" type="range" min="1" max="3" step="0.1" value="1"><output id="zoomValue" class="zoom-value" for="zoomSlider">1.0x</output></div><div class="row"><button id="scanBtn">摄像头扫码</button><button class="secondary" id="stopScanBtn" disabled>停止扫描</button><button class="secondary" id="imageBtn">选择二维码图片</button><input id="qrImage" type="file" accept="image/*" class="hidden"><input id="qr" placeholder="也可粘贴二维码原文"><button id="signBtn">对启用账号签到</button></div><p id="scanHint" class="muted">安卓手机优先用系统自带识别；其他浏览器自动改用多策略识别（自动降采样、局部二值化、分块扫描），二维码不必居中。可用缩放滑块拉近画面，摄像头需要 HTTPS。也可选择二维码图片或粘贴原文。</p><pre id="scanResult"></pre></section>
  <section><h2>点名列表</h2><button id="rollcallsBtn">立即刷新</button><span id="lastRefresh" class="muted"></span><div id="rollcalls"></div></section>
</main>
<script>
const $=id=>document.getElementById(id); let loggedIn=false,stream=null,scanActive=false,scanFrameHandle=null,qrDecoderPromise=null,cameraTrack=null,hardwareZoom=false,digitalZoom=1,zoomApplyTimer=null;
// ---- 交互反馈：按钮转圈 / 顶部进度条 / toast ----
let busyCount=0;
function updateProgressBar(){const bar=$('progress');if(!bar)return;bar.classList.toggle('on',busyCount>0)}
function setBusy(button,on){
  if(!button)return;
  if(on){
    if(button.dataset.busy)return;
    button.dataset.busy='1';
    button.dataset.wasDisabled=button.disabled?'1':'';
    button.classList.add('busy');
    button.disabled=true;
    button.setAttribute('aria-busy','true');
    busyCount++;updateProgressBar();
  }else{
    if(!button.dataset.busy)return;
    delete button.dataset.busy;
    button.classList.remove('busy');
    button.removeAttribute('aria-busy');
    button.disabled=button.dataset.wasDisabled==='1';
    delete button.dataset.wasDisabled;
    busyCount=Math.max(0,busyCount-1);updateProgressBar();
  }
}
async function withBusy(button,task){setBusy(button,true);try{return await task()}finally{setBusy(button,false)}}
function toast(message,type='ok'){
  const box=$('toasts');if(!box||!message)return;
  const node=document.createElement('div');node.className='toast '+type;node.textContent=message;
  box.appendChild(node);requestAnimationFrame(()=>node.classList.add('show'));
  setTimeout(()=>{node.classList.remove('show');setTimeout(()=>node.remove(),260)},3200);
}
// ---- 二维码解码：安卓原生 BarcodeDetector 优先，jsQR 多策略兜底 ----
const SCAN_MAX_DIM=1024;      // 整帧识别边长上限：原始 1080p 直接喂给 jsQR 反而更难识别
const SCAN_TILE_MAX=560;      // 分块识别时的边长上限
const SCAN_FRAME_MS=70;       // 帧间隔，约 14fps，避免阻塞页面
const CENTER_REGION=[.19,.19,.62,.62];
const QUAD_REGIONS=[[0,0,.62,.62],[.38,0,.62,.62],[0,.38,.62,.62],[.38,.38,.62,.62]];
const scanCanvas=document.createElement('canvas'),scanContext=scanCanvas.getContext('2d',{willReadFrequently:true});
const tileCanvas=document.createElement('canvas'),tileContext=tileCanvas.getContext('2d',{willReadFrequently:true});
let grayBuffer=null,binBuffer=null,integralBuffer=null;
let nativeDetectorPromise=null,scanBusy=false,scanStrategy=0,lastScanAt=0;
function loadQrDecoder(){if(typeof window.jsQR==='function')return Promise.resolve(window.jsQR);if(qrDecoderPromise)return qrDecoderPromise;qrDecoderPromise=new Promise((resolve,reject)=>{const urls=['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js','https://fastly.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'];let index=0;const next=()=>{if(index>=urls.length){qrDecoderPromise=null;reject(Error('二维码识别库加载失败，请检查网络后重试，或选择二维码图片/粘贴原文'));return}const script=document.createElement('script');script.src=urls[index++];script.async=true;script.onload=()=>typeof window.jsQR==='function'?resolve(window.jsQR):next();script.onerror=()=>{script.remove();next()};document.head.appendChild(script)};next()});return qrDecoderPromise}
function getNativeDetector(){if(nativeDetectorPromise)return nativeDetectorPromise;nativeDetectorPromise=(async()=>{try{if(typeof window.BarcodeDetector!=='function')return null;if(window.BarcodeDetector.getSupportedFormats){const formats=await window.BarcodeDetector.getSupportedFormats();if(Array.isArray(formats)&&formats.length&&!formats.includes('qr_code'))return null}return new window.BarcodeDetector({formats:['qr_code']})}catch(e){return null}})();return nativeDetectorPromise}
async function detectNative(source){const detector=await getNativeDetector();if(!detector)return null;try{const codes=await detector.detect(source);for(const code of codes||[]){const value=code&&code.rawValue;if(value)return value}}catch(e){/* 部分实现对空帧会抛错，交给 jsQR */}return null}
function ensureBuffers(width,height){const size=width*height;if(!grayBuffer||grayBuffer.length<size)grayBuffer=new Uint8ClampedArray(size);if(!binBuffer||binBuffer.length<size*4)binBuffer=new Uint8ClampedArray(size*4)}
function toGray(data,width,height){ensureBuffers(width,height);const gray=grayBuffer,size=width*height;for(let i=0,j=0;j<size;i+=4,j++)gray[j]=(data[i]*77+data[i+1]*150+data[i+2]*29)>>8;return gray.subarray(0,size)}
function otsuThreshold(gray){const histogram=new Uint32Array(256);for(let i=0;i<gray.length;i++)histogram[gray[i]]++;const total=gray.length;let sum=0;for(let i=0;i<256;i++)sum+=i*histogram[i];let sumB=0,wB=0,best=0,threshold=128;for(let i=0;i<256;i++){wB+=histogram[i];if(!wB)continue;const wF=total-wB;if(!wF)break;sumB+=i*histogram[i];const diff=sumB/wB-(sum-sumB)/wF;const between=wB*wF*diff*diff;if(between>best){best=between;threshold=i}}return threshold}
function binarize(gray,width,height,threshold,invert){const out=binBuffer,size=width*height;for(let i=0;i<size;i++){const dark=gray[i]<=threshold;const value=(dark!==invert)?0:255;const j=i*4;out[j]=out[j+1]=out[j+2]=value;out[j+3]=255}return out.subarray(0,size*4)}
// 局部自适应阈值：解决镜头中心亮、边缘暗时的整帧阈值失效，是提升识别率的关键一步
function adaptiveBinarize(gray,width,height,invert){const stride=width+1,need=stride*(height+1);if(!integralBuffer||integralBuffer.length<need)integralBuffer=new Uint32Array(need);const integral=integralBuffer;for(let x=0;x<=width;x++)integral[x]=0;for(let y=0;y<=height;y++)integral[y*stride]=0;for(let y=0;y<height;y++){let rowSum=0;for(let x=0;x<width;x++){rowSum+=gray[y*width+x];integral[(y+1)*stride+(x+1)]=integral[y*stride+(x+1)]+rowSum}}const radius=Math.max(6,Math.round(Math.min(width,height)/12)),offset=Math.round(Math.min(width,height)/48)+5;const out=binBuffer,size=width*height;for(let y=0;y<height;y++){const y0=Math.max(0,y-radius),y1=Math.min(height-1,y+radius);for(let x=0;x<width;x++){const x0=Math.max(0,x-radius),x1=Math.min(width-1,x+radius);const count=(x1-x0+1)*(y1-y0+1);const sum=integral[(y1+1)*stride+(x1+1)]-integral[y0*stride+(x1+1)]-integral[(y1+1)*stride+x0]+integral[y0*stride+x0];const dark=gray[y*width+x]*count<sum-offset*count;const value=(dark!==invert)?0:255;const j=(y*width+x)*4;out[j]=out[j+1]=out[j+2]=value;out[j+3]=255}}return out.subarray(0,size*4)}
function decodeWith(jsqr,imageData,width,height,mode){const data=imageData.data,pick=result=>result&&result.data?result.data:null;if(mode==='raw')return pick(jsqr(data,width,height,{inversionAttempts:'attemptBoth'}));const gray=toGray(data,width,height);if(mode==='adaptive')return pick(jsqr(adaptiveBinarize(gray,width,height,false),width,height,{inversionAttempts:'dontInvert'}));if(mode==='adaptive-invert')return pick(jsqr(adaptiveBinarize(gray,width,height,true),width,height,{inversionAttempts:'dontInvert'}));if(mode==='otsu'){const threshold=otsuThreshold(gray);return pick(jsqr(binarize(gray,width,height,threshold,false),width,height,{inversionAttempts:'dontInvert'}))}if(mode==='otsu-invert'){const threshold=otsuThreshold(gray);return pick(jsqr(binarize(gray,width,height,threshold,true),width,height,{inversionAttempts:'dontInvert'}))}return null}
async function getCameraStream(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;if(!legacy)throw Error('浏览器没有可用的摄像头接口；请使用 HTTPS 页面或选择二维码图片/粘贴内容');return await new Promise((resolve,reject)=>legacy.call(navigator,{video:{facingMode:'environment'},audio:false},resolve,reject))}
  let wantZoom=false;try{wantZoom=Boolean(navigator.mediaDevices.getSupportedConstraints&&navigator.mediaDevices.getSupportedConstraints().zoom)}catch(e){}
  const base={facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}};
  const ladder=[...(wantZoom?[{video:{...base,zoom:true},audio:false}]:[]),{video:base,audio:false},{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:'environment'},audio:false},{video:true,audio:false}];
  let lastError=null;for(const constraints of ladder){try{return await navigator.mediaDevices.getUserMedia(constraints)}catch(e){lastError=e;if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))throw e}}throw lastError||Error('无法访问摄像头')}
function applyTrackConstraint(track,constraint){const current=typeof track.getConstraints==='function'?track.getConstraints():{};const keys=Object.keys(constraint);const advanced=Array.isArray(current.advanced)?current.advanced.filter(item=>!keys.some(key=>key in item)):[];return track.applyConstraints({...current,advanced:[...advanced,constraint]})}
function updateScanGuideSize(){const preview=$('video').parentElement;if(!preview)return;const size=Math.max(0,Math.min(preview.clientWidth*.68,preview.clientHeight*.8,280));if(size>0)$('scanGuide').style.width=`${size}px`}
function updateZoomLabel(value){$('zoomValue').textContent=`${Number(value).toFixed(1)}x`}
function configureDigitalZoom(){hardwareZoom=false;digitalZoom=1;const slider=$('zoomSlider');slider.min='1';slider.max='3';slider.step='0.1';slider.value='1';$('video').style.transform=''}
function setDigitalZoom(value){configureDigitalZoom();const slider=$('zoomSlider');slider.value=String(Math.max(1,Math.min(3,Number(value)||1)));digitalZoom=Number(slider.value);$('video').style.transform=`scale(${digitalZoom})`;updateZoomLabel(digitalZoom)}
async function configureCameraControls(track){
  cameraTrack=track||null;
  let capabilities={};
  try{if(track&&typeof track.getCapabilities==='function')capabilities=track.getCapabilities()||{}}catch(e){}
  const canApply=Boolean(track&&typeof track.applyConstraints==='function');
  const preferred=[];
  if(Array.isArray(capabilities.focusMode)&&capabilities.focusMode.includes('continuous'))preferred.push({focusMode:'continuous'});
  if(Array.isArray(capabilities.exposureMode)&&capabilities.exposureMode.includes('continuous'))preferred.push({exposureMode:'continuous'});
  for(const constraint of preferred){try{await applyTrackConstraint(track,constraint)}catch(e){console.debug('摄像头不支持该约束',constraint,e)}}
  const range=capabilities.zoom;
  hardwareZoom=Boolean(canApply&&range&&Number.isFinite(range.min)&&Number.isFinite(range.max)&&range.max>range.min);
  const slider=$('zoomSlider');
  if(hardwareZoom){
    slider.min=String(range.min);slider.max=String(range.max);slider.step=Number.isFinite(range.step)&&range.step>0?String(range.step):'0.1';
    let settings={};try{if(typeof track.getSettings==='function')settings=track.getSettings()||{}}catch(e){}
    slider.value=String(Number.isFinite(settings.zoom)?settings.zoom:range.min);
    digitalZoom=1;$('video').style.transform='';
  }else configureDigitalZoom();
  updateZoomLabel(slider.value);
  $('zoomControls').classList.remove('hidden');
  $('scanGuide').classList.remove('hidden');
  updateScanGuideSize();
}
function applyScanZoom(){
  const value=Number($('zoomSlider').value);
  updateZoomLabel(value);
  if(!hardwareZoom){digitalZoom=value;$('video').style.transform=`scale(${digitalZoom})`;return}
  $('video').style.transform='';
  if(zoomApplyTimer!==null)clearTimeout(zoomApplyTimer);
  zoomApplyTimer=setTimeout(()=>{
    zoomApplyTimer=null;
    if(!scanActive||!cameraTrack)return;
    Promise.resolve().then(()=>applyTrackConstraint(cameraTrack,{zoom:value})).catch(async()=>{
      if(!scanActive||!cameraTrack)return;
      try{const capabilities=cameraTrack.getCapabilities?cameraTrack.getCapabilities():{};if(Number.isFinite(capabilities.zoom&&capabilities.zoom.min))await applyTrackConstraint(cameraTrack,{zoom:capabilities.zoom.min})}catch(e){}
      if(scanActive)setDigitalZoom(value);
    });
  },80);
}
function resetCameraControls(){if(zoomApplyTimer!==null){clearTimeout(zoomApplyTimer);zoomApplyTimer=null}cameraTrack=null;hardwareZoom=false;digitalZoom=1;$('video').style.transform='';$('zoomControls').classList.add('hidden');$('scanGuide').classList.add('hidden');$('scanGuide').style.width='';$('zoomSlider').min='1';$('zoomSlider').max='3';$('zoomSlider').step='0.1';$('zoomSlider').value='1';updateZoomLabel(1)}
function stopCameraScan(){scanActive=false;scanBusy=false;if(scanFrameHandle!==null){if(window.cancelAnimationFrame)cancelAnimationFrame(scanFrameHandle);else clearTimeout(scanFrameHandle);scanFrameHandle=null}resetCameraControls();if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}const video=$('video');if(video){try{video.pause()}catch(e){}video.srcObject=null}if($('scanBtn'))$('scanBtn').disabled=false;if($('stopScanBtn'))$('stopScanBtn').disabled=true}
function scheduleScanFrame(){if(!scanActive){scanFrameHandle=null;return}const raf=window.requestAnimationFrame||(callback=>setTimeout(callback,16));scanFrameHandle=raf(()=>{scanFrameHandle=null;scanVideoFrame()})}
function videoCrop(){const video=$('video');const vw=video.videoWidth||0,vh=video.videoHeight||0;const zoom=hardwareZoom?1:digitalZoom;const sw=vw/zoom,sh=vh/zoom;return {sx:(vw-sw)/2,sy:(vh-sh)/2,sw,sh}}
function drawVideoFrame(video,maxDim){const crop=videoCrop();if(!crop.sw||!crop.sh)return null;const scale=Math.min(1,maxDim/Math.max(crop.sw,crop.sh));const width=Math.max(1,Math.round(crop.sw*scale)),height=Math.max(1,Math.round(crop.sh*scale));scanCanvas.width=width;scanCanvas.height=height;scanContext.drawImage(video,crop.sx,crop.sy,crop.sw,crop.sh,0,0,width,height);return {width,height}}
function drawVideoRegion(video,rx,ry,rw,rh,maxDim){const crop=videoCrop();const sw=crop.sw*rw,sh=crop.sh*rh;if(sw<16||sh<16)return null;const sx=crop.sx+crop.sw*rx,sy=crop.sy+crop.sh*ry;const scale=Math.min(1,maxDim/Math.max(sw,sh));const width=Math.max(1,Math.round(sw*scale)),height=Math.max(1,Math.round(sh*scale));tileCanvas.width=width;tileCanvas.height=height;tileContext.drawImage(video,sx,sy,sw,sh,0,0,width,height);return {width,height}}
async function detectFromVideo(){const video=$('video');if(!video||video.readyState<2||!video.videoWidth||!video.videoHeight)return null;const frame=drawVideoFrame(video,SCAN_MAX_DIM);if(!frame)return null;const native=await detectNative(scanCanvas);if(native)return native;const jsqr=await loadQrDecoder();if(!scanActive)return null;const strategy=scanStrategy++%6;
  if(strategy<4){const mode=['raw','adaptive','otsu','otsu-invert'][strategy];return decodeWith(jsqr,scanContext.getImageData(0,0,frame.width,frame.height),frame.width,frame.height,mode)}
  // 二维码偏在一角、或占画面较小时，整帧定位容易失败：改为局部放大和重叠分块
  const regions=strategy===4?[CENTER_REGION]:QUAD_REGIONS;
  const modes=strategy===4?['raw','adaptive']:['raw'];
  for(const [rx,ry,rw,rh] of regions){const region=drawVideoRegion(video,rx,ry,rw,rh,SCAN_TILE_MAX);if(!region)continue;const imageData=tileContext.getImageData(0,0,region.width,region.height);for(const mode of modes){const found=decodeWith(jsqr,imageData,region.width,region.height,mode);if(found)return found}}return null}
function onQrFound(raw){$('qr').value=raw;$('scanHint').textContent='二维码已识别，正在提交签到…';stopCameraScan();toast('二维码已识别');submitQr()}
async function scanVideoFrame(){if(!scanActive)return;if(scanBusy){scheduleScanFrame();return}const now=(window.performance&&performance.now)?performance.now():Date.now();if(now-lastScanAt<SCAN_FRAME_MS){scheduleScanFrame();return}lastScanAt=now;scanBusy=true;let found=null,decoderError=false;try{found=await detectFromVideo()}catch(e){decoderError=String((e&&e.message)||'').includes('识别库加载失败');if(!decoderError)console.warn('二维码帧解析失败',e)}finally{scanBusy=false}if(decoderError){stopCameraScan();$('scanHint').textContent='扫码组件加载失败，请改用「选择二维码图片」或直接粘贴二维码原文';toast('扫码组件加载失败','bad');return}if(!scanActive)return;if(found){onQrFound(found);return}scheduleScanFrame()}
async function decodeImageFile(file){const imageUrl=URL.createObjectURL(file);try{const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('无法读取所选图片'));img.src=imageUrl});try{const native=await detectNative(image);if(native)return native}catch(e){}const jsqr=await loadQrDecoder();const longest=Math.max(image.naturalWidth,image.naturalHeight)||1;for(const factor of [1,1.6,.65]){const target=Math.min(2400,Math.max(320,longest*factor)),scale=target/longest;const width=Math.max(1,Math.round(image.naturalWidth*scale)),height=Math.max(1,Math.round(image.naturalHeight*scale));scanCanvas.width=width;scanCanvas.height=height;scanContext.drawImage(image,0,0,width,height);const imageData=scanContext.getImageData(0,0,width,height);for(const mode of ['raw','adaptive','otsu','otsu-invert']){const found=decodeWith(jsqr,imageData,width,height,mode);if(found)return found}}for(const [rx,ry,rw,rh] of [CENTER_REGION,...QUAD_REGIONS]){const sourceWidth=Math.max(1,Math.round(image.naturalWidth*rw)),sourceHeight=Math.max(1,Math.round(image.naturalHeight*rh));const scale=Math.min(1,1200/Math.max(sourceWidth,sourceHeight));const width=Math.max(1,Math.round(sourceWidth*scale)),height=Math.max(1,Math.round(sourceHeight*scale));scanCanvas.width=width;scanCanvas.height=height;scanContext.drawImage(image,Math.round(image.naturalWidth*rx),Math.round(image.naturalHeight*ry),sourceWidth,sourceHeight,0,0,width,height);const imageData=scanContext.getImageData(0,0,width,height);for(const mode of ['raw','adaptive']){const found=decodeWith(jsqr,imageData,width,height,mode);if(found)return found}}return null}finally{URL.revokeObjectURL(imageUrl)}}
async function submitQr(){
  const raw=$('qr').value.trim();
  if(!raw)return alert('先扫码或粘贴二维码内容');
  await withBusy($('signBtn'),async()=>{
    try{
      const x=await api('/api/sign/qr',{method:'POST',body:JSON.stringify({raw})});
      renderResults(x,$('scanResult'));signSummary(x,'二维码签到');
      if(sessionExpiredIn(x))refreshAccountStatus();
      loadRollcalls();
    }catch(e){alert(e.message)}
  });
}
let authEpoch=0;
async function api(path,options={}){const epoch=authEpoch;const r=await fetch(path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await r.json().catch(()=>({message:'服务器响应无法解析'}));if(r.status===401&&path!=='/api/session'){/* 重新登录后，旧会话发出的请求才会 401，不能拿它把新界面重置掉 */if(epoch===authEpoch){loggedIn=false;$('auth').classList.remove('hidden');$('app').classList.add('hidden')}throw Error(data.message||'会话已失效')}if(!r.ok&&data.message)throw Error(data.message);return data}
async function loadSettings(){try{const s=await api('/api/settings');$('minDelay').value=s.min_delay_seconds;$('maxDelay').value=s.max_delay_seconds;$('autoNumber').checked=s.auto_number;$('radarScheme').value=s.radar_scheme;$('probePoints').value=(s.probes||[]).map(p=>`${p.latitude},${p.longitude}`).join('\n')}catch(e){console.warn(e)}}
$('saveSettings').onclick=()=>withBusy($('saveSettings'),async()=>{
  try{
    const probes=$('probePoints').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const [latitude,longitude]=x.split(',').map(Number);if(!Number.isFinite(latitude)||!Number.isFinite(longitude))throw Error('探测点格式错误');return {latitude,longitude}});
    const x=await api('/api/settings',{method:'PUT',body:JSON.stringify({min_delay_seconds:Number($('minDelay').value),max_delay_seconds:Number($('maxDelay').value),auto_number:$('autoNumber').checked,radar_scheme:$('radarScheme').value,probes})});
    toast(x.message||'设置已保存');
  }catch(e){alert(e.message)}
});
async function showLogin(){authEpoch++;loggedIn=true;$('auth').classList.add('hidden');$('app').classList.remove('hidden');loadSettings();await loadAccounts();refreshAccountStatus();loadRollcalls()}
$('adminBtn').onclick=()=>withBusy($('adminBtn'),async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('admin').value})});await showLogin()}catch(e){alert(e.message)}});
$('schoolBtn').onclick=()=>withBusy($('schoolBtn'),async()=>{
  try{
    const x=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value,remember_me:$('remember').checked})});
    $('pass').value='';
    toast(x.message||'登录成功');
    await refreshAccountStatus();
    loadRollcalls();
  }catch(e){alert(e.message)}
});
let casPoll=null;
$('casWebBtn').onclick=()=>withBusy($('casWebBtn'),async()=>{
  try{
    const start=await api('/api/cas/start',{method:'POST',body:'{}'});
    $('casPanel').classList.remove('hidden');$('casFrame').src=start.url;
    if(casPoll)clearInterval(casPoll);
    casPoll=setInterval(async()=>{
      try{
        const r=await api('/api/cas/status/'+encodeURIComponent(start.flow_id));
        if(r.ok){
          clearInterval(casPoll);casPoll=null;
          $('casPanel').classList.add('hidden');$('casFrame').src='about:blank';
          toast(r.message);await refreshAccountStatus();loadRollcalls();
        }
      }catch(e){clearInterval(casPoll);casPoll=null;toast('认证状态查询失败：'+e.message,'bad')}
    },1800);
    toast('已打开学校认证页面，请在其中完成验证');
  }catch(e){alert(e.message)}
});
$('refreshBtn').onclick=()=>withBusy($('refreshBtn'),async()=>{
  try{
    const x=await api('/api/refresh',{method:'POST',body:'{}'});
    if(Array.isArray(x.accounts)){accountCache=x.accounts;renderAccounts()}
    const failed=x.failed||[],skipped=x.skipped||[];
    if(!failed.length&&!skipped.length){toast(`会话刷新完成：成功 ${x.updated||0} 个账号`)}
    else{
      const lines=[`会话刷新完成：成功 ${x.updated||0} 个`];
      if(failed.length)lines.push('刷新失败，需要重新输入密码：\n'+failed.map(f=>`• ${f.name||f.username||f.id}：${f.message}`).join('\n'));
      if(skipped.length)lines.push('没有保存统一认证票据：\n'+skipped.map(f=>`• ${f.name||f.username||f.id}：${f.message}`).join('\n'));
      alert(lines.join('\n\n'));
    }
    refreshAccountStatus();
    loadRollcalls();
  }catch(e){alert(e.message)}
});
$('accountsBtn').onclick=()=>withBusy($('accountsBtn'),()=>refreshAccountStatus(true));
$('rollcallsBtn').onclick=()=>withBusy($('rollcallsBtn'),async()=>{const ok=await loadRollcalls();toast(ok?'点名列表已刷新':'点名刷新失败，请查看下方提示',ok?'ok':'bad')});
let accountCache=[];
function statusBadge(a){
  if(!a.checked_at)return '<span class="badge unknown">未检测</span>';
  return a.expired?'<span class="badge bad">已过期</span>':'<span class="badge ok">正常</span>';
}
function renderAccounts(){
  if(!accountCache.length){$('accounts').innerHTML='<p class="muted">暂无账号</p>';return}
  const expired=accountCache.filter(a=>a.expired).length;
  const summary=`<p class="muted">共 ${accountCache.length} 个账号${expired?`，其中 <b class="bad">${expired}</b> 个已过期（请用帐号密码重新登录该账号更新会话）`:'，全部正常'}</p>`;
  $('accounts').innerHTML=summary+accountCache.map(a=>{
    const checked=a.checked_at?`检测于 ${new Date(a.checked_at*1000).toLocaleTimeString()}`:'尚未检测';
    const detail=[checked,a.status_detail].filter(Boolean).map(escapeHtml).join(' · ');
    const cannotRefresh=a.can_refresh?'':'<br><span class="muted">未保存统一认证票据，无法自动续期</span>';
    return `<p>${escapeHtml(a.name||a.username)}（${escapeHtml(a.student_id||'未知学号')}） ${statusBadge(a)} · ${a.enabled?'启用':'停用'}<br><span class="muted">${detail}</span>${cannotRefresh}<br><button class="secondary" onclick="toggleAccount('${encodeURIComponent(a.id)}',this)">${a.enabled?'停用':'启用'}</button> <button class="secondary" onclick="deleteAccount('${encodeURIComponent(a.id)}',this)">删除</button></p>`;
  }).join('');
}
async function loadAccounts(){try{const next=await api('/api/accounts');const changed=JSON.stringify(next)!==JSON.stringify(accountCache);accountCache=next;if(changed)renderAccounts()}catch(e){if(loggedIn)console.warn(e)}}
async function refreshAccountStatus(notify=false){
  if(!loggedIn)return;
  try{
    const x=await api('/api/account-status',{method:'POST',body:'{}'});
    if(Array.isArray(x.accounts)){
      accountCache=x.accounts;renderAccounts();
      if(notify){const expired=accountCache.filter(a=>a.expired).length;toast(expired?`检测完成：${expired} 个账号已过期`:'检测完成：所有账号会话正常',expired?'bad':'ok')}
    }
  }catch(e){console.warn('账号状态检测失败',e);if(notify)toast('账号状态检测失败：'+e.message,'bad')}
}
function sessionExpiredIn(x){const list=Array.isArray(x)?x:(x&&Array.isArray(x.results)?x.results:[]);return list.some(r=>String((r&&r.message)||'').includes('登录已过期'))}
function signSummary(x,label){const list=Array.isArray(x)?x:(x&&Array.isArray(x.results)?x.results:[]);if(!list.length)return;const ok=list.filter(r=>r.success).length;toast(`${label}：成功 ${ok}/${list.length}`,ok===list.length?'ok':'bad')}
async function toggleAccount(encoded,button){await withBusy(button,async()=>{try{const x=await api('/api/accounts/'+encodeURIComponent(decodeURIComponent(encoded)),{method:'PUT',body:'{}'});toast(x.enabled?'账号已启用':'账号已停用');await loadAccounts()}catch(e){alert(e.message)}})}
async function deleteAccount(encoded,button){if(!confirm('确认删除该账号及其会话？'))return;await withBusy(button,async()=>{try{await api('/api/accounts/'+encodeURIComponent(decodeURIComponent(encoded)),{method:'DELETE'});toast('账号已删除');await loadAccounts()}catch(e){alert(e.message)}})}
async function loadRollcalls(){if(!loggedIn)return false;try{const xs=await api('/api/rollcalls');$('lastRefresh').textContent='更新于 '+new Date().toLocaleTimeString();$('rollcalls').innerHTML=xs.length?xs.map(r=>`<div class="rollcall"><b>${escapeHtml(r.course_title||r.title)}</b> · ${escapeHtml(r.title)}<div>${escapeHtml(r.rollcall_time)} · ${escapeHtml(r.status)}${r.is_expired?' · 已结束':''}</div>${r.is_number?`<button onclick="numberSign('${encodeURIComponent(r.id)}',this)">数字签到</button>`:''}${r.is_radar?`<button onclick="radarTriangulate('${encodeURIComponent(r.id)}',this)">雷达三点签到</button><button class="secondary" onclick="radarManual('${encodeURIComponent(r.id)}',this)">输入坐标签到</button>`:''}</div>`).join(''):'暂无点名';return true}catch(e){$('rollcalls').textContent=e.message;return false}}
async function numberSign(encoded,button){
  const code=$('autoNumber').checked?'':prompt('输入 4 位签到码');
  if(code===null)return;
  await withBusy(button,async()=>{try{const x=await api('/api/sign/number',{method:'POST',body:JSON.stringify({rollcall_id:decodeURIComponent(encoded),code})});renderResults(x,$('scanResult'));signSummary(x,'数字签到');if(sessionExpiredIn(x))refreshAccountStatus()}catch(e){alert(e.message)}});
}
async function radarManual(encoded,button){
  const lat=prompt('纬度'),lon=prompt('经度');
  if(lat===null||lon===null)return;
  await withBusy(button,async()=>{try{const x=await api('/api/sign/radar',{method:'POST',body:JSON.stringify({rollcall_id:decodeURIComponent(encoded),latitude:Number(lat),longitude:Number(lon)})});renderResults(x,$('scanResult'));signSummary(x,'雷达签到');if(sessionExpiredIn(x))refreshAccountStatus()}catch(e){alert(e.message)}});
}
async function radarTriangulate(encoded,button){
  const rid=decodeURIComponent(encoded);
  if($('radarScheme').value==='empty'){
    await withBusy(button,async()=>{try{const x=await api('/api/sign/radar/empty',{method:'POST',body:JSON.stringify({rollcall_id:rid,code:''})});renderResults(x,$('scanResult'));if(x&&x.ok===false)toast(x.message||'雷达签到失败','bad');signSummary(x,'雷达签到');if(sessionExpiredIn(x))refreshAccountStatus()}catch(e){alert(e.message)}});
    return;
  }
  const probes=$('probePoints').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const [latitude,longitude]=x.split(',').map(Number);return {latitude,longitude}});
  if(probes.length<3)return alert('请先在签到设置中填写至少三个探测点');
  await withBusy(button,async()=>{try{const x=await api('/api/sign/radar/triangulate',{method:'POST',body:JSON.stringify({rollcall_id:rid,probes})});renderResults(x,$('scanResult'));if(x&&x.ok===false)toast(x.message||'雷达签到失败','bad');signSummary(x,'雷达签到');if(sessionExpiredIn(x))refreshAccountStatus()}catch(e){alert(e.message)}});
}
$('signBtn').onclick=submitQr;
$('scanBtn').onclick=async()=>{if(scanActive||$('scanBtn').disabled)return;setBusy($('scanBtn'),true);try{const [cameraStream]=await Promise.all([getCameraStream(),getNativeDetector()]);stream=cameraStream;const video=$('video');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.setAttribute('autoplay','');video.playsInline=true;video.autoplay=true;video.muted=true;video.srcObject=stream;try{await video.play()}catch(playError){/* iOS 偶发拒绝自动播放，静音循环会继续尝试，下面提示用户点一下画面 */}scanActive=true;scanStrategy=0;lastScanAt=0;await configureCameraControls(stream.getVideoTracks&&stream.getVideoTracks()[0]);$('stopScanBtn').disabled=false;$('scanHint').textContent='正在扫描，让二维码完整出现在画面内即可，不必居中…';scanVideoFrame();setTimeout(()=>{if(scanActive&&(!video.videoWidth||video.readyState<2))$('scanHint').textContent='画面没有出现？点一下视频区域再试，或改用「选择二维码图片」'},3000)}catch(e){stopCameraScan();$('scanHint').textContent='无法启动扫码：'+e.message}finally{setBusy($('scanBtn'),false)}};
$('stopScanBtn').onclick=()=>{stopCameraScan();$('scanHint').textContent='已停止摄像头扫码。'};
$('zoomSlider').oninput=applyScanZoom;
window.addEventListener('resize',updateScanGuideSize);
$('video').addEventListener('loadedmetadata',updateScanGuideSize);
$('video').onclick=()=>{const video=$('video');if(scanActive&&video.paused){video.play().catch(()=>{})}};
$('imageBtn').onclick=()=>$('qrImage').click();
$('qrImage').onchange=async event=>{const file=event.target.files&&event.target.files[0];if(!file)return;stopCameraScan();await withBusy($('imageBtn'),async()=>{try{const raw=await decodeImageFile(file);if(!raw)throw Error('图片中没有识别到二维码，请换一张二维码更完整清晰的照片');$('qr').value=raw;$('scanHint').textContent='二维码图片已识别，正在提交签到…';await submitQr()}catch(e){$('scanHint').textContent='图片扫码失败：'+e.message}finally{event.target.value=''}})};
function renderResults(x,node){node.textContent=JSON.stringify(x,null,2)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
api('/api/session').then(showLogin).catch(()=>{});
setInterval(()=>{if(loggedIn)loadRollcalls()},10000);
// 点名轮询会顺带刷新服务端缓存的会话状态，这里定期把账号状态同步到页面上。
setInterval(()=>{if(loggedIn)loadAccounts()},30000);
$('admin').addEventListener('keydown',e=>{if(e.key==='Enter')$('adminBtn').click()});
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('schoolBtn').click()});
window.addEventListener('offline',()=>toast('网络已断开，签到请求会失败','bad'));
window.addEventListener('online',()=>toast('网络已恢复','ok'));
</script>
